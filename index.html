<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디플로그 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==" crossorigin="anonymous" referrerpolicy="no-referrer-when-downgrade">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==" crossorigin="anonymous"></script>
<style>
:root{
  /* 레이아웃: 왼쪽 코발트 안내 패널 + 오른쪽 휴대폰 한 대. 좁은 화면에서는 앱만 전체 화면 */
  --cobalt:#1f3fd0;
  --cobalt-deep:#132a8c;
  --ink:#0f1b3d;
  --paper:#f3f5fb;
  --card:#ffffff;
  --line:#dde3f2;
  --muted:#5c6788;
  --pin:#ff6a2b;
  --good:#0f7a57;
  --good-bg:#e3f5ee;
  --warn-bg:#fff1e8;
  --font-display:"Do Hyeon","Noto Sans KR",sans-serif;
  --font-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--cobalt-deep);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--pin);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}

.stage{height:100%;display:flex;gap:40px;align-items:center;justify-content:center;padding:24px}
.guide{width:320px;color:#fff;display:flex;flex-direction:column;gap:16px}
.brand{font-family:var(--font-display);font-size:44px;line-height:1.05}
.brand small{display:block;font-family:var(--font-body);font-size:13px;font-weight:500;opacity:.8;margin-top:10px;line-height:1.5}
.switch{display:flex;background:rgba(255,255,255,.14);border-radius:12px;padding:4px;gap:4px}
.switch button{flex:1;padding:9px 0;border-radius:9px;font-weight:700;color:#fff}
.switch button[aria-pressed="true"]{background:#fff;color:var(--cobalt-deep)}
.steps{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.steps button{width:100%;text-align:left;display:flex;gap:12px;align-items:flex-start;padding:8px 12px;border-radius:12px;color:#fff;background:rgba(255,255,255,.08)}
.steps button:hover{background:rgba(255,255,255,.18)}
.steps .n{font-family:var(--font-display);font-size:20px;line-height:1.1;width:16px}
.steps b{display:block;font-size:14px}
.steps span{font-size:12px;opacity:.78}
.guide .reset{align-self:flex-start;color:#fff;text-decoration:underline;font-size:12px;opacity:.8}
.guide .note{font-size:11.5px;opacity:.65}

.phone{width:390px;height:min(820px,100%);background:var(--paper);border-radius:36px;border:8px solid #0a1230;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.mobilebar{display:none}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
.top{background:var(--card);padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.top h2{font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1.15}
.top .sub{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center}
.back{align-self:flex-start;font-size:13px;font-weight:700;color:var(--cobalt);padding:4px 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.cond[aria-pressed="true"]{background:var(--cobalt);border-color:var(--cobalt)}
.adline{text-align:left;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px}

/* 지도 */
.map{flex:1;min-height:200px;position:relative;background:#e6ebf7;overflow:hidden}
/* Leaflet 지도: #lmap은 한 번만 만들고 render() 때마다 .map 자리에 다시 끼움. z-index:0으로 토스트보다 아래에 둠 */
#lmap{position:absolute;inset:0;z-index:0;font:inherit;color:var(--ink);background:#e6ebf7}
/* 핀: Leaflet divIcon(.pinwrap, 크기 0) 안에 기존 말풍선 모양(.pin)을 가운데 정렬로 넣음 */
.pinwrap:focus{outline:none}
.pinwrap:focus-visible .bub{outline:3px solid var(--pin);outline-offset:2px}
.pin{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px}
.pin .bub{width:38px;height:38px;border-radius:50% 50% 50% 6px;background:#fff;border:2px solid var(--cobalt);display:grid;place-items:center;font-size:19px;line-height:1;box-shadow:0 3px 8px rgba(15,27,61,.2)}
.pin .lbl{font-size:11px;line-height:1.5;font-weight:700;background:#fff;color:var(--ink);border-radius:6px;padding:0 5px;white-space:nowrap;box-shadow:0 1px 3px rgba(15,27,61,.15)}
.pinwrap.pick .bub{border-color:var(--pin)}
.pinwrap[aria-pressed="true"] .bub{background:var(--pin);border-color:var(--pin);transform:scale(1.15)}
.pinwrap[aria-pressed="true"] .lbl{background:var(--ink);color:#fff}
.sheet{background:var(--card);border-top:1px solid var(--line);padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px}
.head{display:flex;gap:12px;align-items:center}
.tile{width:52px;height:52px;border-radius:14px;background:var(--paper);display:grid;place-items:center;font-size:28px;flex:none}
.sheet h3,.card h3{font-size:16px;line-height:1.3}
.meta{font-size:12.5px;color:var(--muted)}
.price{margin-left:auto;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--paper);color:var(--ink);white-space:nowrap}
.tag.pick{background:var(--warn-bg);color:#b8410d}
.tag.live{background:var(--good-bg);color:var(--good)}
.tag.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);margin-right:5px;vertical-align:1px}
.tag.ad{background:#e9e9ef;color:#555b6e}
.tag.paid{background:var(--ink);color:#fff}
.btn{display:block;width:100%;text-align:center;padding:12px;border-radius:12px;font-weight:700;background:var(--cobalt);color:#fff}
.btn.ghost{background:var(--card);color:var(--cobalt);border:1.5px solid var(--cobalt)}
.btn.dark{background:var(--ink)}
.btn.sm{padding:8px;font-size:13px}
.btns{display:flex;gap:8px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:11.5px;font-weight:700;color:var(--cobalt);letter-spacing:.02em}
.seg{display:flex;background:var(--paper);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;padding:6px 2px;border-radius:8px;font-size:12px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(15,27,61,.15)}
.pictos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.picto{background:var(--paper);border-radius:12px;padding:10px 4px;text-align:center;font-size:12px;font-weight:500;display:flex;flex-direction:column;gap:2px;align-items:center;overflow-wrap:anywhere}
.picto i{font-style:normal;font-size:26px;line-height:1.2}
.spice{display:flex;align-items:center;gap:10px;font-weight:700}
.spice .dots{display:flex;gap:3px;font-size:18px}
.spice .off{filter:grayscale(1);opacity:.25}
.picto.hit{background:var(--warn-bg);outline:2px solid var(--pin)}
.warnbox{background:var(--warn-bg);color:#b8410d;font-weight:700;border-radius:10px;padding:10px;font-size:13px}
.tag.warn{background:var(--pin);color:#fff}
.fix{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.fix:first-of-type{border-top:0;padding-top:0}
.steps em{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.04em;opacity:.7;display:block}
.course{display:flex;align-items:stretch;gap:6px}
.course .stop{flex:1;background:var(--paper);border-radius:12px;padding:10px 6px;text-align:center;font-size:12px;display:flex;flex-direction:column;gap:2px}
.course .stop i{font-style:normal;font-size:22px}
.course .stop b{font-size:12.5px}
.course .arrow{align-self:center;color:var(--muted);font-size:11px;text-align:center;white-space:nowrap}
button.stop:hover{outline:2px solid var(--cobalt)}
.timeline{display:flex;height:22px;border-radius:6px;overflow:hidden;font-size:10.5px;font-weight:700;color:#fff}
.timeline span{display:grid;place-items:center;white-space:nowrap;overflow:hidden}

textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;resize:vertical;background:var(--card);color:var(--ink)}
.notice{font-size:12px;color:var(--muted);background:var(--paper);border-radius:10px;padding:10px}
.coupon{border:2px dashed var(--pin);background:var(--warn-bg);border-radius:14px;padding:14px;text-align:center}
.coupon b{font-family:var(--font-display);font-weight:400;font-size:26px;display:block;color:#b8410d}
.stamps{display:flex;gap:8px}
.stamps i{flex:1;aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-style:normal;font-size:18px}
.stamps i.on{border:2px solid var(--pin);background:var(--warn-bg)}

.rank{display:flex;align-items:center;gap:10px}
.rank .no{font-family:var(--font-display);font-size:22px;width:20px;text-align:center;color:var(--muted)}
.rank.hot .no{color:var(--pin)}
.rank .body{flex:1;min-width:0}
.bar{height:6px;border-radius:3px;background:var(--paper);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--cobalt);border-radius:3px;transition:width .5s}
.rank.me .bar i{background:var(--pin)}
.rank .score{font-weight:700;font-variant-numeric:tabular-nums;width:26px;text-align:right}
.vote{font-size:12px;font-weight:700;color:var(--cobalt);border:1px solid var(--cobalt);border-radius:8px;padding:3px 8px;white-space:nowrap}
.vote[disabled]{color:var(--muted);border-color:var(--line);cursor:default}

.big{background:var(--ink);color:#fff;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:4px}
.big .num{font-family:var(--font-display);font-size:64px;line-height:1;color:#ffd9c7;font-variant-numeric:tabular-nums}
.big p{font-size:14px}
.big small{opacity:.7;font-size:12px}
.big .line{display:flex;justify-content:space-between;font-size:13px;border-top:1px solid rgba(255,255,255,.15);padding-top:6px;margin-top:4px}
.big .line b{font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:11.5px;color:var(--muted)}
.week{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:16px;border-bottom:1px solid var(--line)}
.week .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted)}
.week .col i{display:block;width:100%;background:#c3cdf2;border-radius:5px 5px 0 0}
.week .col.today i{background:var(--cobalt)}
.week .col.today{color:var(--ink);font-weight:700}
.days{display:flex;gap:8px;font-size:11px;color:var(--muted);text-align:center}
.days span{flex:1}
.tally{display:flex;align-items:center;gap:8px;font-size:13px}
.tally .name{width:72px}
.tally .bar{flex:1;margin:0}
.tally .cnt{width:30px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.lock{display:flex;gap:6px}
.lock i{flex:1;height:10px;border-radius:5px;background:var(--line)}
.lock i.on{background:var(--cobalt)}
.aicard{border:2px solid var(--cobalt);background:#eef1fd}
.done{background:var(--good-bg);color:var(--good);font-weight:700;border-radius:12px;padding:12px;font-size:13px}
.notif{display:flex;gap:10px;align-items:flex-start}
.notif .dot{width:8px;height:8px;border-radius:50%;background:var(--pin);margin-top:6px;flex:none}
.notif.read .dot{background:var(--line)}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:12px}
ol.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

.nav{display:flex;background:var(--card);border-top:1px solid var(--line)}
.nav button{flex:1;padding:10px 0 12px;font-size:11.5px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.nav button i{font-style:normal;font-size:18px;filter:grayscale(1);opacity:.6}
.nav button[aria-current="page"]{color:var(--cobalt)}
.nav button[aria-current="page"] i{filter:none;opacity:1}
.badge{position:absolute;top:6px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;background:var(--pin);color:#fff;font-size:10px;line-height:16px;padding:0 4px}
.toast{position:absolute;left:16px;right:16px;bottom:76px;background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;font-size:13px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

@media (max-width:820px){
  .stage{padding:0;display:block}
  .guide{display:none}
  .phone{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
  .mobilebar{display:flex;align-items:center;gap:12px;background:var(--cobalt-deep);color:#fff;padding:8px 16px}
  .mobilebar b{font-family:var(--font-display);font-weight:400;font-size:20px}
  .mobilebar .switch{flex:1;max-width:220px;margin-left:auto}
  .mobilebar .switch button{padding:6px 0;font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="stage">
  <aside class="guide">
    <div class="brand">D-PLOG<small>디플로그 · 「어디 가서 뭐 먹지?」가 아닌 「뭐를 어디서 먹을지」<br>찾고 → 소통하고 → 보상받는 골목</small></div>
    <div class="switch" role="group" aria-label="화면 전환">
      <button data-act="mode" data-v="student">학생 화면</button>
      <button data-act="mode" data-v="owner">사장님 화면</button>
    </div>
    <ol class="steps">
      <li><button data-act="step" data-v="1"><span class="n">1</span><span><em>01 · FIND</em><b>메뉴 핀 지도</b><span>가게 이름이 아닌 음식 핀으로 찾아요</span></span></button></li>
      <li><button data-act="step" data-v="2"><span class="n">2</span><span><em>01 · FIND</em><b>재료·알레르기</b><span>핀을 누르면 재료와 내 알레르기까지</span></span></button></li>
      <li><button data-act="step" data-v="3"><span class="n">3</span><span><em>02 · TALK</em><b>리뷰와 비밀 피드백</b><span>칭찬은 공개로, 아쉬운 점은 사장님에게만</span></span></button></li>
      <li><button data-act="step" data-v="4"><span class="n">4</span><span><em>03 · REWARD</em><b>사장님: 실시간 반응</b><span>지금 몇 명이 보는지 바로 보여요</span></span></button></li>
      <li><button data-act="step" data-v="5"><span class="n">5</span><span><em>02 · TALK</em><b>사장님: 월간 리포트</b><span>3건 이상 모이면 요약과 개선안이 와요</span></span></button></li>
      <li><button data-act="step" data-v="6"><span class="n">6</span><span><em>03 · REWARD</em><b>개선했어요 알림과 캠퍼스 픽</b><span>고친 가게가 매월 뽑혀요</span></span></button></li>
    </ol>
    <button class="reset" data-act="reset">처음 상태로 되돌리기</button>
    <p class="note">가게는 실제 가게이고, 숫자·순위·알림은 모두 시연용 가상 예시예요.</p>
  </aside>

  <main class="phone">
    <div class="mobilebar">
      <b>디플로그</b>
      <div class="switch" role="group" aria-label="화면 전환">
        <button data-act="mode" data-v="student">학생</button>
        <button data-act="mode" data-v="owner">사장님</button>
      </div>
    </div>
    <div id="app"></div>
    <div class="toast" id="toast" role="status"></div>
  </main>
</div>

<script>
/* ---------- 데이터 (전부 시연용 가상 예시) ---------- */
const LANGS = [["ko","한국어"],["en","EN"],["zh","中文"],["vi","Việt"],["ne","नेपाली"]];
const UI = {
  ing:  {ko:"재료·알레르기", en:"Ingredients & allergens", zh:"食材·过敏原", vi:"Nguyên liệu & dị ứng", ne:"सामग्री र एलर्जी"},
  spice:{ko:"맵기", en:"Spiciness", zh:"辣度", vi:"Độ cay", ne:"पिरोपन"}
};
const ING = {
  pork:     {e:"🐷", ko:"돼지고기",   en:"Pork",       zh:"猪肉",       vi:"Thịt lợn",           ne:"सुँगुरको मासु"},
  shrimp:   {e:"🦐", ko:"새우",       en:"Shrimp",     zh:"虾",         vi:"Tôm",                ne:"झिंगा"},
  shellfish:{e:"🐚", ko:"조개",       en:"Shellfish",  zh:"贝类",       vi:"Sò ốc",              ne:"सिपी"},
  wheat:    {e:"🌾", ko:"밀",         en:"Wheat",      zh:"小麦",       vi:"Lúa mì",             ne:"गहुँ"},
  egg:      {e:"🥚", ko:"달걀",       en:"Egg",        zh:"鸡蛋",       vi:"Trứng",              ne:"अण्डा"},
  milk:     {e:"🥛", ko:"우유",       en:"Milk",       zh:"牛奶",       vi:"Sữa",                ne:"दूध"},
  soy:      {e:"🫘", ko:"대두(두부)", en:"Soy (tofu)", zh:"大豆(豆腐)", vi:"Đậu nành (đậu phụ)", ne:"भटमास (टोफु)"},
  fish:     {e:"🐟", ko:"생선",       en:"Fish",       zh:"鱼",         vi:"Cá",                 ne:"माछा"},
  peanut:   {e:"🥜", ko:"땅콩",       en:"Peanut",     zh:"花生",       vi:"Đậu phộng",          ne:"बदाम"}
};
const SPICE = [
  {ko:"안 매움",   en:"Not spicy",  zh:"不辣", vi:"Không cay", ne:"पिरो छैन"},
  {ko:"조금 매움", en:"Mild",       zh:"微辣", vi:"Cay nhẹ",   ne:"थोरै पिरो"},
  {ko:"매움",      en:"Spicy",      zh:"辣",   vi:"Cay",       ne:"पिरो"},
  {ko:"아주 매움", en:"Very spicy", zh:"特辣", vi:"Rất cay",   ne:"धेरै पिरो"}

        <button class="vote" data-act="vote" data-v="${n}" ${S.voted?"disabled":""}>${S.voted===n?"추천함":"추천"}</button></div>`).join("")}
    </div>
    <p class="notice">선정 기준은 공개해요: 학생 평가, 방문 인증, 개선 반영. 광고비로는 뽑힐 수 없고 매월 다시 선정해요. 추천은 한 달에 한 번이에요.</p>
  </div>`;
}
function vNotif(){
  return `
  <div class="top"><div><h2>알림·쿠폰</h2><p class="sub">내가 남긴 의견이 어떻게 쓰였는지 알려 드려요</p></div></div>
  <div class="scroll">
    <div class="card"><span class="eyebrow">알림</span>
      ${S.notifs.map(n=>`<div class="notif ${n.read?"read":""}"><span class="dot"></span><div><b>${n.t}</b><p class="meta">${n.d}</p></div></div>`).join("")}
    </div>
    <div class="card"><span class="eyebrow">코스 스탬프 투어 · ${S.stamps}/5</span>
      <div class="stamps">${[0,1,2,3,4].map(i=>`<i class="${i<S.stamps?"on":""}">${i<S.stamps?"🍽️":""}</i>`).join("")}</div>
      <p class="meta">식당과 카페 두 곳을 방문 인증할 때마다 1개가 찍혀요. 5개를 모으면 쿠폰을 드려요.${S.course.meal&&!S.course.sweet?" 지금 카페만 인증하면 1개가 찍혀요.":""}</p>
    </div>
    <div class="card"><span class="eyebrow">내 쿠폰</span>
      ${S.coupons.length ? S.coupons.map(c=>`<div class="row"><b>${c.s}</b><span class="meta" style="margin-left:auto">${c.d}</span></div>`).join("") : `<p class="empty">방문 인증을 하거나 의견을 남기면 쿠폰이 쌓여요.</p>`}
    </div>
  </div>`;
}

/* ---------- 사장님 화면 ---------- */
function vLive(){
  const week = [132,148,121,176,190,97,S.views], max = Math.max(...week);
  return `
  <div class="top"><div><h2>${MYSTORE} 사장님</h2><p class="sub">실시간 반응 · 홍보 효과를 바로 확인해요</p></div></div>
  <div class="scroll">
    <div class="big"><small>현재 내 가게 메뉴를</small><span class="num"><span data-total>${S.viewers[MY]+S.sub}</span>명</span><p>이 보고 있습니다</p>
      <div class="line"><span>칼국수</span><b><span data-live="${MY}">${S.viewers[MY]}</span>명</b></div>
      <div class="line"><span>수제비</span><b><span data-sub>${S.sub}</span>명</b></div>
      <div class="line"><span>길 안내 시작 (가는 중)</span><b><span data-going="${MY}">${S.going[MY]}</span>명</b></div>
      <small>최근 30분 · 학교 단위 숫자만 · 개인 위치는 저장하지 않아요</small></div>
    <div class="stats">
      <div class="stat"><b data-views>${S.views}</b><span>오늘 핀 조회</span></div>
      <div class="stat"><b>${38+(S.navTo[MY]?1:0)}</b><span>오늘 길 안내</span></div>
      <div class="stat"><b>${17+(S.verified[MY]?1:0)}</b><span>방문 인증</span></div>
    </div>
    <div class="card"><span class="eyebrow">이번 주 핀 조회 수</span>
      <div class="week">${week.map((v,i)=>`<div class="col ${i===6?"today":""}"><span ${i===6?"data-views":""}>${v}</span><i style="height:${Math.round(v/max*80)}px"></i></div>`).join("")}</div>
      <div class="days">${["목","금","토","일","월","화","오늘"].map(d=>`<span>${d}</span>`).join("")}</div>
    </div>
  </div>`;
}
function vReport(){
  const n = S.fbs.length, t = tally(), open = n>=3;
  return `
  <div class="top"><div><h2>11월 월간 리포트</h2><p class="sub">비밀 피드백 요약과 바로 해 볼 개선안</p></div></div>
  <div class="scroll">
    <div class="card"><div class="row"><b>이번 달 비밀 피드백 ${n}건</b><span class="meta" style="margin-left:auto">${open?"요약 공개됨":"3건부터 요약 공개"}</span></div>
      <div class="lock">${[0,1,2].map(i=>`<i class="${i<n?"on":""}"></i>`).join("")}</div>
      ${open?"":`<p class="notice">작성자를 추측할 수 없도록 3건이 모일 때까지 내용을 잠가요. 학생 화면에서 한 건을 더 보내 보세요.</p><button class="btn ghost" data-act="step" data-v="3">학생 화면에서 피드백 보내기</button>`}
    </div>
    ${open ? `
    <div class="card aicard"><span class="eyebrow">AI 요약</span>
      <h3>가장 많이 나온 이야기는 ‘${t[0][0]}’이에요</h3>
      ${t.map(([k,c])=>`<div class="tally"><span class="name">${k}</span><div class="bar"><i style="width:${Math.round(c/t[0][1]*100)}%"></i></div><span class="cnt">${c}건</span></div>`).join("")}
      <p class="meta">원문과 작성자는 표시하지 않아요.</p>
    </div>
    <div class="card"><span class="eyebrow">아쉬운 점마다 바로 해 볼 개선안</span>
      ${t.slice(0,3).map(([k])=>`<div class="fix"><b>${k}</b><p>${AI_TIP[k]}</p>
        ${S.applied===k ? `<div class="done">‘개선했어요’ 카드 발송 · 의견 남긴 학생 ${n}명에게 알림 · 캠퍼스 픽 +${APPLY_BONUS}점</div>`
          : S.applied ? "" : `<button class="btn sm" data-act="apply" data-v="${k}">고쳤어요, ‘개선했어요’ 보내기</button>`}</div>`).join("")}
    </div>` : ""}
    <p class="notice">다음 단계에서 추가할 내용: 상권 메뉴 수요 TOP 5, 개선 전후 반응 비교</p>
  </div>`;
}
function vOwnerPick(){
  const r = ranking(), idx = r.findIndex(x=>x[0]===MYSTORE), s = S.scores[MYSTORE], cut = r[2][1];
  const parts = [["학생 평가", 30+(S.voted===MYSTORE?1:0)], ["방문 인증", 28], ["개선 반영", 20+(S.applied?APPLY_BONUS:0)]];
  return `
  <div class="top"><div><h2>캠퍼스 픽 도전</h2><p class="sub">매월 선정 · 앱 상단 노출 + 가게 현판</p></div></div>
  <div class="scroll">
    <div class="big"><small>11월 현재 순위</small><span class="num">${idx+1}위</span><p>${idx<3?"지금 순위면 이번 달 캠퍼스 픽에 뽑혀요":`3위까지 ${cut-s+1}점 남았어요`}</p></div>
    <div class="card"><div class="row"><b>내 점수</b><span class="price">${s}점</span></div><div class="bar"><i style="width:${s}%"></i></div>
      ${parts.map(([k,v])=>`<div class="tally"><span class="name">${k}</span><div class="bar"><i style="width:${v/40*100}%"></i></div><span class="cnt">${v}</span></div>`).join("")}
    </div>
    <p class="notice">기준은 학생에게도 공개해요. 광고비로는 점수를 올릴 수 없고 매월 다시 선정해요.</p>
    ${S.applied?"":`<button class="btn ghost" data-act="otab" data-v="report">월간 리포트에서 ‘개선했어요’ 보내기</button>`}
  </div>`;
}

/* ---------- 지도 (Leaflet + OpenStreetMap) ----------
   render()는 #app을 통째로 다시 그리므로, 지도는 #lmap 요소에 한 번만 만들어 두고
   그릴 때마다 #mapSlot 자리에 같은 요소를 다시 끼워 넣는다. 위치·줌·타일이 그대로 남는다. */
const MAP = {el:null, map:null, markers:{}, lastSel:undefined, reset:false};
function syncMap(){
  const slot = $("#mapSlot"); if(!slot) return;
  if(typeof L === "undefined"){ slot.innerHTML = '<p class="empty">지도를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</p>'; return; }
  if(!MAP.map){
    MAP.el = document.createElement("div"); MAP.el.id = "lmap";
    slot.appendChild(MAP.el);
    MAP.map = L.map(MAP.el).setView([STATION.lat, STATION.lng], MAP_ZOOM);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 기여자'
    }).addTo(MAP.map);
    MENUS.forEach(m => {
      const mk = L.marker([m.lat, m.lng], {
        keyboard:true,
        icon: L.divIcon({className:"pinwrap"+(m.pick?" pick":""), iconSize:null,
          html:`<div class="pin"><span class="bub">${m.e}</span><span class="lbl">${m.name.ko}</span></div>`})
      });
      mk.on("click", () => { ACT.sel(m.id); render(); const el = mk.getElement(); if(el) el.focus({preventScroll:true}); });
      MAP.markers[m.id] = mk;
    });
  } else {
    slot.appendChild(MAP.el);
    MAP.map.invalidateSize(false);
  }
  if(MAP.reset){ MAP.reset = false; MAP.lastSel = undefined; MAP.map.setView([STATION.lat, STATION.lng], MAP_ZOOM, {animate:false}); }
  const list = visible(), show = new Set(list.map(m => m.id));
  MENUS.forEach(m => {
    const mk = MAP.markers[m.id], on = MAP.map.hasLayer(mk);
    if(show.has(m.id) && !on) mk.addTo(MAP.map);
    if(!show.has(m.id) && on) mk.remove();
    const el = mk.getElement(); if(!el) return;
    const picked = S.sel === m.id;
    el.setAttribute("aria-pressed", picked);
    el.setAttribute("aria-label", `${m.name.ko} ${won(m.price)}, ${m.store}`);
    mk.setZIndexOffset(picked ? 1000 : 0);
  });
  /* 선택이 바뀌었는데 그 핀이 화면 밖이면 그쪽으로 옮김 */
  if(S.sel !== MAP.lastSel){
    MAP.lastSel = S.sel;
    const m = list.find(x => x.id === S.sel);
    if(m && !MAP.map.getBounds().pad(-0.15).contains([m.lat, m.lng])) MAP.map.panTo([m.lat, m.lng]);
  }
}

/* ---------- 렌더 ---------- */
function render(){
  let body, nav;
  if(S.mode==="student"){
    const scr = {detail:vDetail, review:vReview, done:vDone}[S.screen];
    body = scr ? scr() : {map:vMap, pick:vPick, notif:vNotif}[S.tab]();
    nav = [["map","📍","메뉴 지도"],["pick","🏅","캠퍼스 픽"],["notif","🔔","알림·쿠폰"]]
      .map(([k,i,l])=>`<button data-act="tab" data-v="${k}" ${!S.screen&&S.tab===k?'aria-current="page"':""}><i>${i}</i>${l}${k==="notif"&&S.unread?`<span class="badge">${S.unread}</span>`:""}</button>`).join("");
  } else {
    body = {live:vLive, report:vReport, opick:vOwnerPick}[S.otab]();
    nav = [["live","📈","실시간 반응"],["report","📑","월간 리포트"],["opick","🏅","캠퍼스 픽"]]
      .map(([k,i,l])=>`<button data-act="otab" data-v="${k}" ${S.otab===k?'aria-current="page"':""}><i>${i}</i>${l}${k==="report"&&S.fbs.length>=3&&!S.applied?'<span class="badge">1</span>':""}</button>`).join("");
  }
  $("#app").innerHTML = body + `<nav class="nav">${nav}</nav>`;
  document.querySelectorAll('[data-act="mode"]').forEach(b=>b.setAttribute("aria-pressed", b.dataset.v===S.mode));
  syncMap();
}

function verify(){
  const m = menu(S.target); S.verified[m.id] = true;
  const kind = m.cat==="sweet" ? "sweet" : "meal"; S.course[kind] = true;
  let msg = "방문 인증을 마쳤어요.";
  if(kind==="meal" && !S.linked){ S.linked = true; S.coupons.push({s:"근처 카페·디저트", d:"식당 인증 연계 · 500원 할인"}); msg += " 근처 카페 쿠폰을 드렸어요."; }
  if(S.course.meal && S.course.sweet){ S.stamps++; S.course = {meal:false,sweet:false}; msg += " 코스 스탬프 1개가 찍혔어요.";
    if(S.stamps>=5){ S.stamps = 0; S.coupons.push({s:"코스 스탬프 완성", d:"2,000원 할인"}); } }
  S.fbSel = []; S.screen = "review"; toast(msg);
}
const ACT = {
  mode(v){ S.mode=v; },
  tab(v){ S.tab=v; S.screen=null; if(v==="notif"){ S.unread=0; setTimeout(()=>{S.notifs.forEach(n=>n.read=true)},0); } },
  otab(v){ S.otab=v; },
  cat(v){ S.cat=v; },
  solo(){ S.solo=!S.solo; },
  quiet(){ S.quiet=!S.quiet; },
  gap(){ S.gap = {0:60, 60:40, 40:0}[S.gap]; },
  sel(v){ S.sel=v; },
  walk(){ const m=menu(S.sel); if(S.navTo[m.id]){ toast("이미 길 안내 중이에요."); return false; }
    S.navTo[m.id]=true; S.going[m.id]++; toast(`${m.store}까지 도보 ${m.walk}분. '가는 중' 숫자에 학교 단위로 1명이 더해져요.`); },
  detail(v){ S.target=v; S.screen="detail"; },
  back(){ S.screen=null; S.tab="map"; S.sel=S.target; },
  home(){ S.screen=null; S.tab="map"; },
  lang(v){ S.lang=v; },
  myAl(v){ S.myAllergy = S.myAllergy.includes(v) ? S.myAllergy.filter(x=>x!==v) : [...S.myAllergy,v]; },
  verify,
  review(){ S.screen="review"; S.fbSel=[]; },
  fbTag(v, b){ S.fbSel = S.fbSel.includes(v) ? S.fbSel.filter(x=>x!==v) : [...S.fbSel,v]; b.setAttribute("aria-pressed", S.fbSel.includes(v)); return false; },
  send(){ const good=$("#goodText").value.trim(), bad=$("#badText").value.trim(), secret = S.fbSel.length>0 || !!bad;
    if(!good && !secret){ toast("좋았던 점이나 아쉬운 점 중 하나는 남겨 주세요."); return false; }
    const m = menu(S.target);
    if(good) S.reviews.push({id:m.id, text:good});
    if(secret && m.id===MY) S.fbs.push(S.fbSel.length ? [...S.fbSel] : ["기타"]);
    S.coupons.push({s:m.store, d:"두 번째 방문 · 500원 할인"}); S.written[m.id]=true;
    S.sent = {good:!!good, secret}; S.screen="done"; },
  apply(v){ S.applied=v; S.scores[MYSTORE]+=APPLY_BONUS;
    S.notifs.unshift({t:`${MYSTORE}가 개선했어요`, d:`${v}: ${AI_TIP[v]}`, read:false}); S.unread++;
    toast("의견을 남긴 학생에게 ‘개선했어요’ 알림을 보냈어요."); },
  vote(v){ if(S.voted) return false; S.voted=v; S.scores[v]++; toast(`${v}를 이번 달 캠퍼스 픽으로 추천했어요.`); },
  step(v){ v=+v;
    if(v===1){ S.mode="student"; S.screen=null; S.tab="map"; S.cat="all"; S.solo=false; S.quiet=false; S.gap=0; S.sel=MY; }
    if(v===2){ S.mode="student"; S.target="jjim"; S.screen="detail"; S.lang="ko"; }
    if(v===3){ S.mode="student"; S.target=MY; if(S.written[MY]) S.screen="detail"; else if(S.verified[MY]){ S.screen="review"; S.fbSel=[]; } else verify(); }
    if(v===4){ S.mode="owner"; S.otab="live"; }
    if(v===5){ S.mode="owner"; S.otab="report"; }
    if(v===6){ S.mode="student"; S.screen=null; S.tab = S.applied ? "notif" : "pick"; if(S.applied) S.unread=0; }
  },
  reset(){ init(); MAP.reset = true; }
};
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
  if(ACT[b.dataset.act](b.dataset.v, b) !== false) render();
});

/* 실시간 숫자: 화면을 다시 그리지 않고 숫자만 바꿉니다 */
setInterval(()=>{
  const step = (n,lo,hi) => Math.max(lo, Math.min(hi, n + Math.floor(Math.random()*3)-1));
  MENUS.forEach(m=>{ S.viewers[m.id] = step(S.viewers[m.id],1,19); });
  S.sub = step(S.sub,1,9);
  if(Math.random()<.5) S.views++;
  document.querySelectorAll("[data-live]").forEach(el=>el.textContent=S.viewers[el.dataset.live]);
  document.querySelectorAll("[data-going]").forEach(el=>el.textContent=S.going[el.dataset.going]);
  document.querySelectorAll("[data-sub]").forEach(el=>el.textContent=S.sub);
  document.querySelectorAll("[data-total]").forEach(el=>el.textContent=S.viewers[MY]+S.sub);
  document.querySelectorAll("[data-views]").forEach(el=>el.textContent=S.views);
}, 2500);

init(); render();
</script>
</body>
</html>
